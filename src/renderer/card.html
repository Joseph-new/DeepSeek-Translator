<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
<title>译文</title>
<style>
  :root {
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
            "HarmonyOS Sans SC", "Segoe UI Variable Text", "Segoe UI",
            "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    --accent: #0a84ff;
    --danger: #e5484d;
    --ease: cubic-bezier(.32,.72,0,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; }
  body {
    font-family: var(--font);
    color: #0a0c10;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  .glass {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    border-radius: 18px;
    background: linear-gradient(180deg, rgba(255,255,255,.975) 0%, rgba(243,245,250,.955) 100%);
    backdrop-filter: blur(40px) saturate(190%);
    border: 0.5px solid rgba(0,0,0,.10);
    box-shadow: 0 18px 46px -12px rgba(12,22,45,.40), 0 2px 8px rgba(12,22,45,.16),
                inset 0 1px 0 rgba(255,255,255,.95);
    overflow: hidden;
  }
  .glass::before {
    content: "";
    position: absolute; inset: 0 0 auto 0; height: 44px;
    background: linear-gradient(180deg, rgba(255,255,255,.70), transparent);
    pointer-events: none;
  }
  header {
    position: relative;
    display: flex; align-items: center; gap: 8px;
    height: 34px; padding: 0 8px 0 12px;
    flex: 0 0 auto;
    -webkit-app-region: drag;
  }
  .tag {
    font-size: 11px; color: #0a84ff; font-weight: 500;
    background: rgba(10,132,255,.11);
    padding: 2px 8px; border-radius: 980px;
    -webkit-app-region: no-drag;
  }
  .spacer { flex: 1 1 auto; }
  .ib {
    -webkit-app-region: no-drag;
    border: none; background: transparent;
    width: 24px; height: 24px; border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center;
    color: rgba(26,28,34,.70);
    transition: background .15s var(--ease), color .15s var(--ease);
    font-size: 12px;
  }
  .ib:hover { background: rgba(120,120,128,.14); color: #14161a; }
  .ib.active { background: rgba(10,132,255,.14); color: #0a84ff; }
  .ib svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  .body {
    flex: 1 1 auto; min-height: 0;
    display: flex; flex-direction: column; gap: 8px;
    padding: 2px 14px 0;
  }
  .src {
    font-size: 11.5px; line-height: 1.55; color: rgba(26,28,34,.72);
    max-height: 46px; overflow: hidden;
    padding-bottom: 8px;
    border-bottom: 0.5px solid rgba(0,0,0,.07);
    user-select: text;
    white-space: pre-wrap; word-break: break-word;
  }
  .out {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    font-size: 14.5px; line-height: 1.72;
    white-space: pre-wrap; word-break: break-word;
    user-select: text; padding-bottom: 6px;
  }
  .out::-webkit-scrollbar { width: 7px; }
  .out::-webkit-scrollbar-thumb { background: rgba(0,0,0,.18); border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
  .out.streaming::after {
    content: ""; display: inline-block; width: 2px; height: 1.05em;
    margin-left: 2px; vertical-align: text-bottom;
    background: var(--accent); animation: caret 1s steps(2) infinite;
  }
  @keyframes caret { 0%,100%{opacity:1} 50%{opacity:0} }
  .out.error { color: var(--danger); font-size: 12.5px; }
  footer {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 8px;
    padding: 7px 14px 10px;
    font-size: 10.5px; color: rgba(26,28,34,.62);
    border-top: 0.5px solid rgba(0,0,0,.08);
  }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<div class="glass">
  <header>
    <span class="tag" id="tag">划词</span>
    <span class="spacer"></span>
    <button class="ib" id="btnPin" title="固定窗口（不自动消失）">
      <svg viewBox="0 0 16 16"><path d="M6 2h4l-.6 4.2 2.1 2.1v1.2H9.4L8.6 14 7.8 9.5H4.5V8.3l2.1-2.1z"/></svg>
    </button>
    <button class="ib" id="btnCopy" title="复制译文">
      <svg viewBox="0 0 16 16"><rect x="5.5" y="5.5" width="8" height="8" rx="2"/><path d="M10.5 5.5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v4.5a2 2 0 0 0 2 2h1.5"/></svg>
    </button>
    <button class="ib" id="btnOpen" title="在主窗口打开">
      <svg viewBox="0 0 16 16"><path d="M6.5 3.5H4A1.5 1.5 0 0 0 2.5 5v7A1.5 1.5 0 0 0 4 13.5h7A1.5 1.5 0 0 0 12.5 12V9.5"/><path d="M9 2.5h4.5V7M13.2 2.8L7.8 8.2"/></svg>
    </button>
    <button class="ib" id="btnClose" title="关闭">
      <svg viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
    </button>
  </header>

  <div class="body">
    <div class="src" id="src"></div>
    <div class="out streaming" id="out"></div>
  </div>

  <footer>
    <span id="meta">准备中…</span>
    <span class="spacer"></span>
    <span>Esc 关闭</span>
  </footer>
</div>

<script src="card.js"></script>
</body>
</html>
